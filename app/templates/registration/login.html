{% extends "base.html" %}

{% block title %}Ingresar - Sistema Django{% endblock %}

{% block content %}
<div class="card login-card">
    <h1 class="page-title">Ingresar</h1>
    <p class="muted">Acceso interno al sistema.</p>

    {% if form.errors %}
        <div class="alert alert-error">Usuario o contrasena no validos.</div>
    {% endif %}

    <form class="form-grid" method="post" novalidate>
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next }}">

        <div class="form-field">
            <label for="{{ form.username.id_for_label }}">Usuario</label>
            {{ form.username }}
        </div>

        <div class="form-field">
            <label for="{{ form.password.id_for_label }}">Contrasena</label>
            {{ form.password }}
        </div>

        <button class="btn btn-primary" type="submit">Ingresar</button>
    </form>
</div>
{% endblock %}
